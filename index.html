<style>
/* Layout: faixa institucional no topo (logo sobre painel branco, filete vermelho e azul),
   título editorial em serifa, abas sublinhadas e registros em lista de linhas com
   marcador em paralelogramo, ecoando o monograma do escritório. Cantos retos por padrão. */
:root{
  --ink:#101820; --text-secondary:#4b5259;
  --surface-0:#ffffff; --surface-100:#f7f5f1; --surface-200:#ece8e2;
  --border-subtle:#d9d4cc; --border-strong:#8a8478;
  --brand-red:#a83440; --brand-red-text:#a83440;
  --brand-navy:#003b5c; --brand-navy-text:#003b5c;
  --success:#2f6f5e; --warning:#8a5a12;
  --focus:#003b5c;
  --g1:#a67c00; --g1-bg:#fff6cc; --g2:#b86e0a; --g2-bg:#fdebd0; --g3:#c2531a; --g3-bg:#fadcc9; --g4:#b52b26; --g4-bg:#f7d2cd; --g5:#7a1424; --g5-bg:#f0c8ce;
  --t-erro:var(--brand-red-text); --t-sugestao:var(--success); --t-minuta:var(--brand-navy-text); --t-duvida:var(--warning);
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Montserrat',-apple-system,'Segoe UI',sans-serif;
  --r-sm:2px; --r-md:4px; --r-lg:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#f2efea; --text-secondary:#adb4bc;
    --surface-0:#14181d; --surface-100:#1d2229; --surface-200:#262c34;
    --border-subtle:#2b323a; --border-strong:#6b727a;
    --brand-red-text:#e5808a; --brand-navy-text:#6fa8cc;
    --success:#6fc7b0; --warning:#e3a94f; --focus:#6fa8cc;
    --g1:#e8c547; --g1-bg:#3a3312; --g2:#f0a04b; --g2-bg:#3d2c12; --g3:#f2874f; --g3-bg:#3f2415; --g4:#f27a70; --g4-bg:#3f1b1b; --g5:#f08a98; --g5-bg:#3a1620;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#f2efea; --text-secondary:#adb4bc;
  --surface-0:#14181d; --surface-100:#1d2229; --surface-200:#262c34;
  --border-subtle:#2b323a; --border-strong:#6b727a;
  --brand-red-text:#e5808a; --brand-navy-text:#6fa8cc;
  --success:#6fc7b0; --warning:#e3a94f; --focus:#6fa8cc;
    --g1:#e8c547; --g1-bg:#3a3312; --g2:#f0a04b; --g2-bg:#3d2c12; --g3:#f2874f; --g3-bg:#3f2415; --g4:#f27a70; --g4-bg:#3f1b1b; --g5:#f08a98; --g5-bg:#3a1620;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface-0);color:var(--ink);font:400 15px/1.6 var(--sans)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.overline{font:400 12px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text-secondary)}

/* Faixa superior */
.topband{background:var(--surface-100)}
.topband::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--brand-red) 0 96px,var(--brand-navy) 96px 100%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:16px;padding-bottom:16px}
.logo{background:#fff;padding:10px 16px;display:block;border:1px solid var(--border-subtle)}
.logo img{display:block;height:44px;width:auto;max-width:100%}
.who{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;min-width:0}
.who .nm{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.linkbtn{background:none;border:0;padding:2px 0;cursor:pointer;font-size:12px;font-weight:500;letter-spacing:.03em;color:var(--brand-navy-text);text-decoration:underline;text-underline-offset:3px}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)}
.conn::before{content:"";width:8px;height:8px;background:var(--success)}
.conn.off::before{background:var(--brand-red-text)}

.pagehead{padding-top:32px;padding-bottom:8px}
.pagehead h1{font:600 36px/1.15 var(--serif);margin:6px 0 8px;text-wrap:balance}
.pagehead p{margin:0;max-width:62ch;color:var(--text-secondary)}
@media (max-width:560px){.pagehead h1{font-size:28px}}

/* Abas */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-subtle);margin-top:24px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;cursor:pointer;font:500 13px var(--sans);letter-spacing:.02em;color:var(--text-secondary);white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand-red)}
.cnt{background:var(--brand-red);color:#fff;font:600 11px var(--sans);padding:1px 7px;border-radius:var(--r-sm)}
main{padding-top:28px;padding-bottom:72px}

/* Faixas de aviso */
.banner{border:1px solid var(--c,var(--border-strong));border-left-width:4px;background:var(--surface-100);padding:12px 16px;margin-top:20px;font-size:14px;display:flex;gap:12px 20px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.banner.err{--c:var(--brand-red-text)}
.banner.demo{--c:var(--warning)}
.seg2{display:inline-flex;border:1px solid var(--border-strong)}
.seg2 button{background:var(--surface-0);border:0;padding:6px 12px;cursor:pointer;font:500 12px var(--sans)}
.seg2 button[aria-pressed="true"]{background:var(--brand-navy);color:#fff}

/* Marcador em paralelogramo */
.mk{display:inline-block;width:14px;height:20px;background:var(--c,var(--brand-navy));clip-path:polygon(40% 0,100% 0,60% 100%,0 100%);flex:none;margin-top:4px}

/* Formulário */
.section-h{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.section-h h2{font:600 20px/1.3 var(--serif);margin:0}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:32px}
@media (max-width:640px){.tipos{grid-template-columns:1fr}}
.tipo label{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--border-strong);background:var(--surface-0);cursor:pointer;height:100%}
.tipo label:hover{background:var(--surface-100)}
.tipo input:checked+label{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--surface-100)}
.tipo input:focus-visible+label{outline:3px solid var(--focus);outline-offset:2px}
.tipo input:disabled+label{cursor:default;opacity:.55}
.tipo b{display:block;font:600 18px/1.3 var(--serif)}
.tipo span.d{display:block;font-size:13px;color:var(--text-secondary);margin-top:2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}
.field{margin-bottom:20px;min-width:0}
.field.wide{grid-column:1/-1}
.field>label{display:block;font:500 13px var(--sans);letter-spacing:.02em;margin-bottom:6px}
.req{color:var(--brand-red-text);font-weight:600}
.hint{color:var(--text-secondary);font-size:13px;margin:4px 0 0}
.field input[type=text],.field input[type=date],.field input[type=url],.field select,.field textarea,.modal input[type=text],.modal input[type=email],.modal input[type=password],.login input{width:100%;background:var(--surface-0);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:10px 12px;font:400 15px var(--sans);color:var(--ink)}
.field textarea{min-height:120px;resize:vertical}
.field textarea.big{min-height:220px}
.field [aria-invalid="true"]{border-color:var(--brand-red-text);box-shadow:inset 3px 0 0 var(--brand-red-text)}
.err-t{color:var(--brand-red-text);font-size:13px;font-weight:500;margin:6px 0 0}
.urg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:28px}
@media (max-width:640px){.urg{grid-template-columns:1fr}}
.urg label{display:block;border:1px solid var(--border-strong);padding:12px 14px;cursor:pointer}
.urg label b{display:block;font:600 14px var(--sans)}
.urg label span{display:block;font-size:12.5px;color:var(--text-secondary)}
.urg input:checked+label{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--surface-100)}
.urg input:focus-visible+label{outline:3px solid var(--focus);outline-offset:2px}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.draftnote{font-size:13px;color:var(--text-secondary)}

/* Botões */
.btn{font:600 13px var(--sans);letter-spacing:.03em;padding:12px 20px;border-radius:var(--r-md);border:1px solid transparent;cursor:pointer;background:transparent}
.btn.primary{background:var(--brand-red);color:#fff;border-color:var(--brand-red)}
.btn.navy{background:var(--brand-navy);color:#fff;border-color:var(--brand-navy)}
.btn.ghost{border-color:var(--border-strong);color:var(--ink)}
.btn.danger{border-color:var(--brand-red-text);color:var(--brand-red-text)}
.btn.sm{padding:7px 12px;font-size:12px}
.btn:hover:not(:disabled){filter:brightness(.93)}
.btn.ghost:hover:not(:disabled),.btn.danger:hover:not(:disabled){background:var(--surface-100);filter:none}
.btn:disabled{opacity:.55;cursor:default}

/* Painel */
.stats{display:flex;flex-wrap:wrap;border:1px solid var(--border-subtle);margin-bottom:24px}
.stat{flex:1 1 150px;padding:14px 18px;border-right:1px solid var(--border-subtle)}
.stat:last-child{border-right:0}
.stat b{display:block;font:600 32px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:8px}
.filters .field{margin:0}
.countline{font-size:13px;color:var(--text-secondary);margin:12px 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{background:var(--surface-0);border:1px solid var(--border-strong);padding:7px 14px;font:500 13px var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface-0);border-color:var(--ink)}

/* Registros */
.card{border:1px solid var(--border-subtle);background:var(--surface-0);margin-bottom:12px}
.card.open{border-color:var(--border-strong)}

function errMsg(e){

  if(c==="permission-denied")return"Sem permissão para esta operação. Confira se as regras do Firestore (arquivo firestore.rules) foram publicadas e se o e-mail da liderança está correto.";
  if(c==="unavailable")return"Sem conexão com o servidor. Verifique a internet e tente novamente.";

function authMsg(e){

  if(c==="auth/invalid-email")return"E-mail inválido.";
  if(c==="auth/too-many-requests")return"Muitas tentativas. Aguarde alguns minutos e tente de novo.";

    var chain=Promise.resolve();
    for(var i=0;i<ops.length;i+=200){(function(part){chain=chain.then(function(){var b=db.batch();part.forEach(function(op){b.set(op.ref,op.data);});return b.commit();});})(ops.slice(i,i+200));}

      var ops=[],old={};
      snaps.forEach(function(sn){sn.docs.forEach(function(d){old[d.id]=d.data();if(!ids[d.id])ops.push({del:d.ref});});});
      rows.forEach(function(r){

      });
      var chain=Promise.resolve();
      for(var i=0;i<ops.length;i+=400){(function(part){chain=chain.then(function(){var b=db.batch();part.forEach(function(o){if(o.del)b.delete(o.del);else b.set(o.ref,o.data);});return b.commit();});})(ops.slice(i,i+400));}
      return chain.then(function(){return rows.length;});
    });
  },

    rows.forEach(function(r){ids[r.id]=1;});
    return Promise.all(semanas.map(function(sem){return col.where("semana","==",sem).get();})).then(function(snaps){
      var ops=[];
      snaps.forEach(function(sn){sn.docs.forEach(function(d){if(!ids[d.id])ops.push({del:d.ref});});});
      rows.forEach(function(r){var d=Object.assign({},r);delete d.id;ops.push({ref:col.doc(r.id),data:d});});
      var chain=Promise.resolve();
      for(var i=0;i<ops.length;i+=400){(function(part){chain=chain.then(function(){var b=db.batch();part.forEach(function(o){if(o.del)b.delete(o.del);else b.set(o.ref,o.data,{merge:true});});return b.commit();});})(ops.slice(i,i+400));}
      return chain.then(function(){return rows.length;});
    });
  },

  watchMine:function(uid,ok,err){var me=this;return this.db.collection("pedidos").where("autorUid","==",uid).onSnapshot(function(s){ok(me._map(s));},err);},

  createPedido:function(data){var ref=this.db.collection("pedidos").doc();return ref.set(data).then(function(){return ref.id;});},
  updatePedido:function(id,patch){return this.db.collection("pedidos").doc(id).update(patch);},
  deletePedido:function(id){
    var db=this.db,ref=db.collection("pedidos").doc(id);
    function limpa(nome){return ref.collection(nome).get().then(function(s){var b=db.batch();s.docs.forEach(function(d){b.delete(d.ref);});return b.commit();});}
    return limpa("mensagens").then(function(){return limpa("anexos");}).then(function(){return ref.delete();});
  },
  addAnexo:function(id,a){return this.db.collection("pedidos").doc(id).collection("anexos").add(a);},
  watchAnexos:function(id,ok,err){var me=this;return this.db.collection("pedidos").doc(id).collection("anexos").onSnapshot(function(s){ok(me._map(s).sort(function(a,b){return (a.em||0)-(b.em||0);}));},err);},
  addMsg:function(id,m){return this.db.collection("pedidos").doc(id).collection("mensagens").add(m);},
  exportAll:function(){
    var me=this;
    return this.db.collection("pedidos").get().then(function(s){
      var lista=me._map(s);
      return Promise.all(lista.map(function(p){
        var ref=me.db.collection("pedidos").doc(p.id);
        return ref.collection("mensagens").orderBy("em").get().then(function(ms){p.mensagens=me._map(ms);return ref.collection("anexos").get();})
          .then(function(as){p.anexos=me._map(as);return p;});
      }));
    });
  },
  restore:function(lista){
    var db=this.db,ops=[];
    lista.forEach(function(p){
      var id=p.id,ms=p.mensagens||[],an=p.anexos||[],data=Object.assign({},p);delete data.id;delete data.mensagens;delete data.anexos;
      ops.push({ref:db.collection("pedidos").doc(id),data:data});
      ms.forEach(function(m){var d=Object.assign({},m),mid=d.id;delete d.id;ops.push({ref:db.collection("pedidos").doc(id).collection("mensagens").doc(mid),data:d});});
      an.forEach(function(m){var d=Object.assign({},m),mid=d.id;delete d.id;ops.push({ref:db.collection("pedidos").doc(id).collection("anexos").doc(mid),data:d});});
    });
    var chain=Promise.resolve();
    for(var i=0;i<ops.length;i+=8){(function(part){chain=chain.then(function(){var b=db.batch();part.forEach(function(o){b.set(o.ref,o.data);});return b.commit();});})(ops.slice(i,i+8));}
    return chain.then(function(){return lista.length;});
  }
};

/* ====================== Regras de exibição ====================== */
function isUnread(p){
  var me=S.isLider?"lider":"equipe";
  if(!p.movEm||p.movPor===me)return false;
  return (S.reads[p.id]||0)<p.movEm;
}
function markRead(p){
  var ts=Math.max(Date.now(),p.movEm||0);
  S.reads[p.id]=ts;
  Store.saveRead(S.user.uid,p.id,ts).catch(function(){});
}
function emAberto(p){return p.status==="novo"||p.status==="analise";}
function sigOf(p){
  var ms=S.msgs[p.id];
  return [p.status,p.parecer,p.movEm,p.atualizadoEm,p.urgencia,p.prazoResposta,p.horaResposta,p.gravidade,S.open[p.id]?1:0,isUnread(p)?1:0,
    ms===undefined?"x":ms.length+":"+(ms.length?ms[ms.length-1].em:0),
    S.anex[p.id]===undefined?"x":S.anex[p.id].length,S.isLider?1:0].join("|");

function metaLinha(p){
  var t=TIPOS[p.tipo]||TIPOS.duvida;

function tituloDe(tipo,v){
  if(tipo==="erro")return [v.categoria,v.processo].filter(Boolean).join(" · ");
  if(tipo==="minuta")return ["Minuta de acordo",v.processo].filter(Boolean).join(" · ");

}

function modal(node,opts){
  var root=$("#modalRoot");clear(root);
  var bd=h("div",{class:"backdrop",role:"dialog","aria-modal":"true"},node);
  if(!(opts&&opts.fixo)){
    bd.addEventListener("mousedown",function(e){if(e.target===bd)fechaModal();});
    bd.addEventListener("keydown",function(e){if(e.key==="Escape")fechaModal();});
  }
  root.appendChild(bd);

}
function fechaModal(){clear($("#modalRoot"));}
function confirmar(titulo,texto,ok){

/* ====================== Lista de pedidos ====================== */
function listaVisivel(){
  var l=S.pedidos.slice();
  if(S.tab==="meus"){
    l=l.filter(function(p){
      if(S.filMeus==="abertos")return emAberto(p);
      if(S.filMeus==="respondidos")return p.status==="respondido";
      if(S.filMeus==="concluidos")return p.status==="concluido";
      return true;
    });
    l.sort(function(a,b){return (b.movEm||0)-(a.movEm||0);});
    return l;
  }
  var f=S.fil,q=norm(f.q);
  l=l.filter(function(p){
    if(f.tipo&&p.tipo!==f.tipo)return false;
    if(f.status==="abertos"&&!emAberto(p))return false;
    if(f.status&&f.status!=="abertos"&&p.status!==f.status)return false;
    if(f.urg&&p.urgencia!==f.urg)return false;
    if(f.autor&&p.autorUid!==f.autor)return false;
    if(q){
      var hay=norm([p.titulo,p.processo,p.partes,p.descricao,p.autorNome,p.categoria,p.textoMinuta,p.observacoes].join(" "));
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  });
  l.sort(function(a,b){
    return (ORDEM_STATUS[a.status]-ORDEM_STATUS[b.status])||(ORDEM_URG[a.urgencia||"normal"]-ORDEM_URG[b.urgencia||"normal"])||(((a.prazoResposta||"9")+(a.horaResposta||"")).localeCompare((b.prazoResposta||"9")+(b.horaResposta||"")))||((b.movEm||0)-(a.movEm||0));
  });
  return l;
}
function renderLista(){
  if(!S.listBox)return;
  var list=listaVisivel();
  if(S.tab==="meus")renderChips();else{renderStats();renderAutores();}
  if(S.countBox)S.countBox.textContent=list.length===1?"1 pedido":list.length+" pedidos";
  var seen={},nodes=[];
  list.forEach(function(p){
    var sig=sigOf(p),c=S.cards[p.id];
    if(!c||c.sig!==sig){c={sig:sig,node:buildCard(p)};S.cards[p.id]=c;}
    seen[p.id]=1;nodes.push(c.node);
  });
  Object.keys(S.cards).forEach(function(id){if(!seen[id])delete S.cards[id];});
  var box=S.listBox;
  if(!nodes.length){
    clear(box);
    box.appendChild(S.loaded?emptyNode():h("div",{class:"empty",text:"Carregando pedidos…"}));
    return;
  }
  var cur=Array.prototype.slice.call(box.children),same=cur.length===nodes.length;
  for(var i=0;same&&i<nodes.length;i++)if(cur[i]!==nodes[i])same=false;
  if(!same){clear(box);nodes.forEach(function(n){box.appendChild(n);});}
}

    h("p",{style:"margin:0",text:"Quando a equipe enviar pedidos, eles aparecem aqui."}));
  return h("div",{class:"empty"},h("b",{text:"Nenhum pedido neste filtro"}),h("p",{style:"margin:0",text:"Altere os filtros para ver outros pedidos."}));
}

function renderStats(){
  if(!S.statsBox)return;clear(S.statsBox);
  var P=S.pedidos;
  var d=[["Novos",P.filter(function(p){return p.status==="novo";}).length],

var MAX_ANEXOS=4, MAX_CHARS=850000;
function fmtTam(n){return n>=1048576?(n/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(n/1024))+" KB";}
function lerArquivo(f){
  return new Promise(function(res,rej){
    var rd=new FileReader();
    rd.onerror=function(){rej(new Error("Não foi possível ler "+f.name+"."));};
    rd.onload=function(){
      var url=rd.result;
      if(/^image\/(jpeg|png|webp)$/.test(f.type)){
        var img=new Image();
        img.onerror=function(){rej(new Error("Imagem inválida: "+f.name+"."));};
        img.onload=function(){
          var max=1600,q=0.82,w=img.naturalWidth,hh=img.naturalHeight,k=Math.min(1,max/Math.max(w,hh)),out;
          for(var i=0;i<6;i++){
            var cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(hh*k));
            var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
            out=cv.toDataURL("image/jpeg",q);
            if(out.length<=MAX_CHARS)break;
            k*=0.8;q=Math.max(0.6,q-0.06);
          }
          if(out.length>MAX_CHARS)return rej(new Error("A imagem "+f.name+" é grande demais, mesmo reduzida."));
          res({nome:f.name.replace(/\.[^.]+$/,"")+".jpg",tipo:"image/jpeg",tam:Math.round(out.length*3/4),dados:out});
        };
        img.src=url;
      }else{
        if(url.length>MAX_CHARS)return rej(new Error(f.name+" passa do limite de "+fmtTam(Math.floor(MAX_CHARS*3/4))+" por arquivo."));
        res({nome:f.name,tipo:f.type||"application/octet-stream",tam:f.size,dados:url});
      }
    };
    rd.readAsDataURL(f);
  });
}

var SIGLAS=/\b(cnpj|cpf|inss|fgts|ctps|rpv|cnj|oab|tst|stf|stj|trt\d{0,2}|cdc|clt)\b/gi;
function capIni(o,n){return o.charAt(0)!==o.charAt(0).toLowerCase()&&o.charAt(0)===o.charAt(0).toUpperCase()?n.charAt(0).toUpperCase()+n.slice(1):n;}
function fmtMoedaTxt(t){
  return t.replace(/\br\$\s*(\d{1,3}(?:\.\d{3})+|\d+)(,\d{1,2})?/gi,function(_,i,f){
    var int=i.replace(/\./g,"").replace(/\B(?=(\d{3})+(?!\d))/g,"."),dec=f?(f.slice(1)+"00").slice(0,2):"00";

function profissionaliza(l){
  l=l.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"").replace(/\b(k{3,}|rs{2,}|ha(ha)+h?)\b/gi,"");
  l=l.replace(/!+/g,".").replace(/\?{2,}/g,"?").replace(/\.{2,}/g,".").replace(/\bobs[.:]\s*/gi,"Observação: ");
  var letras=l.replace(/[^A-Za-zÀ-ú]/g,"");
  if(letras.length>14&&letras.replace(/[^A-ZÀ-Ú]/g,"").length/letras.length>0.7){
    l=l.toLowerCase().replace(SIGLAS,function(m){return m.toUpperCase();}).replace(/\bpje\b/g,"PJe");
  }
  l=l.replace(/\b(tipo assim|meio que)\b/gi,"").replace(/\bné\b\??/gi,"").replace(/\bpro\b/gi,"para o").replace(/\bnuma\b/gi,"em uma").replace(/\bnum\b/gi,"em um");
  l=l.replace(/\besta\b(?=\s+(divergente|errad[oa]|incorret[oa]|ausente|incomplet[oa]|desatualizad[oa]|duplicad[oa]|diferente|faltando|sem|com|fora)\b)/gi,function(w){return capIni(w,"está");});
  l=l.replace(/\bp\/(?=\s)/g,"para").replace(/\bc\/(?=\s)/g,"com").replace(/\bs\/(?=\s)/g,"sem");
  l=l.replace(/[A-Za-zÀ-ú]+/g,function(w){var k=w.toLowerCase();return Object.prototype.hasOwnProperty.call(PAL_FORMAL,k)&&(k.length>1||w===k)?capIni(w,PAL_FORMAL[k]):w;});

function temaCurto(txt,tipo){
  var n=norm(txt),base="";
  var melhor=1e9;
  for(var i=0;i<TEMAS.length;i++){var pos=n.search(TEMAS[i][1]);if(pos>=0&&pos<melhor){melhor=pos;base=TEMAS[i][0];}}
  var qual="";
  if(tipo==="erro"){for(var j=0;j<QUAL_ERRO.length;j++)if(QUAL_ERRO[j][0].test(n)){qual=QUAL_ERRO[j][1];break;}}
  else if(tipo==="sugestao"){qual="melhoria";for(var k=0;k<QUAL_SUG.length;k++)if(QUAL_SUG[k][0].test(n)){qual=QUAL_SUG[k][1];break;}}
  else if(tipo==="duvida")qual="dúvida";
  if(!base){
    var stop=/^(a|o|as|os|um|uma|de|do|da|dos|das|em|no|na|nos|nas|que|com|por|para|foi|era|ser|nao|mais|mas|ao|aos|ele|ela|isso|esse|essa|este|esta|ter|tem|havia|esta|estava|houve|sobre)$/;
    var ws=(String(txt).split(/[.!?\n]/)[0]||"").split(/\s+/).filter(function(w){var x=norm(w).replace(/[^a-z0-9]/g,"");return x.length>2&&!stop.test(x);}).slice(0,4);
    base=ws.join(" ");base=base.charAt(0).toUpperCase()+base.slice(1);
  }

  return t.length>60?t.slice(0,60).replace(/\s+\S*$/,"")+"…":t;
}
function revisarTexto(txt,tipo){
  var linhas=String(txt||"").replace(/\r/g,"").split("\n").map(function(l){return l.trim()?profissionaliza(l):"";});

  return {texto:texto,tema:temaCurto(txt,tipo),resumo:r.replace(/\.$/,"")};
}

  function fb(){var t=h("textarea",{style:"position:fixed;opacity:0"});t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy");toast("Copiado.");}catch(e){toast("Não foi possível copiar.");}t.remove();}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast("Copiado.");},fb);else fb();
}
function semanasAg(){var m={};S.agenda.forEach(function(a){if(a.semana)m[a.semana]=1;});return Object.keys(m).sort();}
function semPadrao(){
  var l=semanasAg();if(!l.length)return"";
  var cur=mondayKey(new Date());
  if(l.indexOf(cur)>=0)return cur;
  for(var i=0;i<l.length;i++)if(l[i]>cur)return l[i];
  return l[l.length-1];
}
function startAgenda(){
  var tok=S.agTok=(S.agTok||0)+1;
  S.agenda=[];S.agLoaded=false;S.agErr="";S.advNome="";S.agSem="";S.agFil={formato:"",adv:"",dia:"",tipo:"",trt:"",ord:""};S.papel="";
  var onData=function(l){
    if(tok!==S.agTok)return;
    S.agenda=l;S.agLoaded=true;S.agErr="";
    if(!S.agSem||semanasAg().indexOf(S.agSem)<0)S.agSem=semPadrao();
    if(S.tab==="agenda")renderAgenda();
  };
  var onErr=function(e){
    if(tok!==S.agTok)return;
    S.agLoaded=true;
    S.agErr=(e&&e.code==="permission-denied")?"Sem permissão para ler a agenda. Confira se as regras do Firestore da agenda foram publicadas e se a sua conta foi vinculada pela liderança.":errMsg(e);
    if(S.tab==="agenda")renderAgenda();
  };
  if(S.isLider){
    S.unsubAg=Store.watchAgendaAll(onData,onErr);
    startAcordos(tok);
    startMetas(tok);
    S.unsubEq=Store.watchEquipe(function(l){S.equipeLista=l;if(S.tab==="impagenda")renderEquipeLista();},function(){});
  }else{
    Store.loadEquipe(S.user.email).then(function(eq){
      if(tok!==S.agTok)return;
      if(!eq||!eq.adv){S.advNome="";S.agLoaded=true;if(S.tab==="agenda")renderAgenda();return;}

      if(eq.papel==="acordos"){S.papel="acordos";startAcordos(tok);renderTabs();if(S.tab==="agenda")go("acordos");return;}
      S.unsubAg=Store.watchAgendaAdv(eq.adv,onData,onErr);
    }).catch(onErr);
  }
}

function hdrKey(c){return norm(c).replace(/[^a-z0-9]+/g," ").trim();}
var AG_COLS=[["dia",/^dia/],["hora",/^horario|^hora/],["formato",/^formato|^modalidade/],["tipo",/^tipo/],["trt",/^trt/],["vara",/forum|vara/],["proc",/processo/],["rec",/^reclamante/],["rda",/^reclamada/],["valor",/^valor/],["link",/^link/],["reuniao",/^id da reuniao/],["senha",/^senha/],["adv",/^advogado|^responsavel/],["atencao",/^ponto de atencao/],["oportunidade",/^oportunidade/],["sugmin",/^minimo sugerido/],["sugmax",/^ate r/],["situacao",/^situacao da projecao/],["cobertura",/^cobertura dos contatos/]];
function parseDia(v){
  if(typeof v==="number"&&isFinite(v)){var d=XLSX.SSF.parse_date_code(v);return d?d.y+"-"+pad(d.m)+"-"+pad(d.d):"";}
  var t=String(v||"").trim(),m=/^(\d{4})-(\d{2})-(\d{2})/.exec(t);if(m)return m[1]+"-"+m[2]+"-"+m[3];
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(t);return m?m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]):"";
}
function parseHora(v){
  if(typeof v==="number"&&isFinite(v)){var mins=Math.round((v%1)*1440);return pad(Math.floor(mins/60))+":"+pad(mins%60);}
  var m=/^(\d{1,2}):(\d{2})/.exec(String(v||"").trim());return m?pad(+m[1])+":"+m[2]:"";
}
function parseValor(v){
  if(typeof v==="number")return isFinite(v)?v:null;
  var t=String(v||"").replace(/[^\d.,-]/g,"");if(!t)return null;
  if(t.indexOf(",")>=0)t=t.replace(/\./g,"").replace(",",".");
  var n=parseFloat(t);return isFinite(n)?n:null;
}
function lerAgenda(buf){
  var wb=XLSX.read(buf,{type:"array"});
  var ws=wb.Sheets[wb.SheetNames[0]];
  var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
  var hi=-1,map={};
  for(var i=0;i<Math.min(rows.length,15)&&hi<0;i++){
    var m={};rows[i].forEach(function(c,j){var k=hdrKey(c);AG_COLS.forEach(function(d){if(m[d[0]]===undefined&&d[1].test(k))m[d[0]]=j;});});
    if(m.dia!==undefined&&m.proc!==undefined){hi=i;map=m;}
  }
  if(hi<0)throw new Error("Não encontrei o cabeçalho (colunas Dia e Nº do processo). Use a planilha Agenda_semana gerada pela tarefa semanal.");
  var out={},extra={},ign=0,semLink=0,unif=0;
  function cel(r,k){return map[k]===undefined?"":r[map[k]];}
  for(var j=hi+1;j<rows.length;j++){
    var r=rows[j],dia=parseDia(cel(r,"dia")),proc=String(cel(r,"proc")||"").trim();
    if(!dia||!proc){if(r.some(function(c){return c!=="";}))ign++;continue;}
    var advRaw=String(cel(r,"adv")||"").trim(),adv=normAdv(advRaw);if(adv!==advRaw)unif++;
    var lk=(/https?:\/\/[^\s,)"]+/.exec(String(cel(r,"link")||""))||[""])[0];
    var fm=String(cel(r,"formato")||"").trim();
    if(fm.toLowerCase().indexOf("virtual")===0&&!lk)semLink++;
    var nz=function(x){x=String(x||"").trim();return /^n[aã]o (se aplica|informada)/i.test(x)?"":x;};
    extra[dia+"_"+proc]={cob:String(cel(r,"cobertura")||"").trim(),min:parseValor(cel(r,"sugmin")),max:parseValor(cel(r,"sugmax")),sit:String(cel(r,"situacao")||"").trim()};
    out[dia+"_"+proc]={id:dia+"_"+proc,dia:dia,hora:parseHora(cel(r,"hora")),formato:fm,tipo:String(cel(r,"tipo")||"").trim(),trt:cel(r,"trt")===""?null:+cel(r,"trt")||null,
      vara:String(cel(r,"vara")||"").trim(),processo:proc,reclamante:String(cel(r,"rec")||"").trim(),reclamadas:String(cel(r,"rda")||"").trim(),
      valor:parseValor(cel(r,"valor")),link:lk,reuniao:nz(cel(r,"reuniao")),senha:nz(cel(r,"senha")),atencao:String(cel(r,"atencao")||"").trim(),oportunidade:String(cel(r,"oportunidade")||"").trim(),adv:adv,advKey:norm(adv),semana:mondayKey(parseKey(dia)),importadoEm:Date.now()};
  }
  var lista=Object.keys(out).map(function(k){return out[k];});
  if(lista.length&&!lista.some(function(a){return a.adv;}))throw new Error("A planilha não traz o advogado responsável de nenhuma audiência. Use o arquivo Agenda_semana, que tem a coluna Advogado responsável, e não a planilha Audiências e acordos sozinha.");
  var cont=lerContatos(wb),acordos=lista.map(function(a){
    var x=extra[a.id]||{};
    return {id:a.id,dia:a.dia,hora:a.hora,formato:a.formato,tipo:a.tipo,vara:a.vara,processo:a.processo,reclamante:a.reclamante,reclamadas:a.reclamadas,valor:a.valor,adv:a.adv,semana:a.semana,
      cobertura:x.cob||"",sugMin:x.min==null?null:x.min,sugMax:x.max==null?null:x.max,sugSituacao:x.sit||"",oportunidade:a.oportunidade||"",contatos:cont[a.processo]||[],importadoEm:a.importadoEm};
  });
  return {lista:lista,acordos:acordos,ignoradas:ign,semLink:semLink,unificados:unif};
}
var CT_COLS=[["proc",/processo/],["quem",/^reclamada representada/],["patrono",/^patrono/],["origem",/^origem/],["wa",/^whatsapp normalizado/],["emails",/^e mail/],["tel",/^telefone/],["classif",/^classificacao/],["vinculo",/^vinculo/],["obs",/^observacoes/]];
function lerContatos(wb){
  var nome=wb.SheetNames.filter(function(n){return norm(n).trim()==="contatos";})[0];
  if(!nome)return {};
  var rows=XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,raw:true,defval:""});
  var hi=-1,map={};
  for(var i=0;i<Math.min(rows.length,15)&&hi<0;i++){
    var m={};rows[i].forEach(function(c,j){var k=hdrKey(c);CT_COLS.forEach(function(d){if(m[d[0]]===undefined&&d[1].test(k))m[d[0]]=j;});});
    if(m.proc!==undefined&&m.quem!==undefined){hi=i;map=m;}
  }
  if(hi<0)return {};
  var out={};
  function cel(r,k){return map[k]===undefined?"":String(r[map[k]]==null?"":r[map[k]]).trim();}
  for(var j=hi+1;j<rows.length;j++){
    var r=rows[j],proc=cel(r,"proc");if(!proc)continue;
    var c={quem:cel(r,"quem"),patrono:cel(r,"patrono"),origem:cel(r,"origem"),wa:cel(r,"wa").replace(/\D/g,""),
      emails:cel(r,"emails").split(/[;,\s]+/).filter(function(e){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);}).map(function(e){return e.toLowerCase();}),
      tel:cel(r,"tel"),classif:cel(r,"classif"),obs:[cel(r,"vinculo"),cel(r,"obs")].filter(Boolean).join(" ")};
    var key=[c.patrono,c.wa,c.emails.join(","),c.tel].join("|");
    var l=out[proc]=out[proc]||[];
    if(!l.some(function(x){return x._k===key&&x.quem===c.quem;})){c._k=key;l.push(c);}
  }
  Object.keys(out).forEach(function(k){out[k].forEach(function(c){delete c._k;});});
  return out;
}

function dateKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function mondayKey(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return dateKey(x);}

function br(k){var p=String(k||"").split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:String(k||"");}
function weekLabel(k){return br(k)+" a "+br(addDays(k,4));}

    function txt(h) { var c = rgb(h); doc.setTextColor(c[0], c[1], c[2]); }
    function font(f, st, sz, cor) { doc.setFont(f, st); doc.setFontSize(sz); txt(cor); }

    function paragrafos(text, w) {
      var out = [];
      String(text || "").split(/\n+/).forEach(function (par) {

/* ====================== Metas: conversões e avaliações ====================== */
var MT_DEF={conv:[[5,150],[7,250],[10,400]],coletMeta:30,coletBonus:600,coletMin:3,aval:[[6,80],[10,150]],incluirAval:true};
var MT_ORIG={testemunha:"Testemunha",indicacao:"Indicação",ltv:"LTV"};
var MT_MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function mtMoney(n){return (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}).replace(/ /g," ");}
function mtNewId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function mtIni(nome){var p=String(nome||"?").trim().split(/\s+/);return ((p[0]||"?")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase();}
function mtCfg(){
  var c=S.mtCfg||{},r={};
  Object.keys(MT_DEF).forEach(function(k){r[k]=(c.regras&&c.regras[k]!=null)?c.regras[k]:MT_DEF[k];});
  return {equipe:c.equipe||[],regras:r};
}
function mtFaixa(t,n){var b=null;t.forEach(function(x){if(n>=x[0])b=x;});return b;}
function mtProx(t,n){for(var i=0;i<t.length;i++)if(n<t[i][0])return t[i];return null;}
function mtRow(e,cs,as,R){
  var valid=as.filter(function(x){return +x.nota===5;}),nc=cs.length,na=valid.length;
  var fc=mtFaixa(R.conv,nc),fa=mtFaixa(R.aval,na);
  return {id:e.id,nome:e.nome,adv:e.adv||"",ativo:e.ativo!==false,convs:cs,avals:as,nc:nc,na:na,
    semPrint:valid.filter(function(x){return !x.temPrint;}).length,faixaConv:fc,faixaAval:fa,
    premioConv:fc?fc[1]:0,premioAval:fa?fa[1]:0,bonus:0,total:0,elegivel:nc>=R.coletMin};
}
/* Cálculo de uma semana. Liderança: todos os lançamentos. Equipe: só os próprios; o coletivo vem do resumo gravado pela liderança. */
function mtSemana(mk){
  var C=mtCfg(),R=C.regras,fim=addDays(mk,6),docs=S.mtDocs||[];
  function dentro(x){return x.data>=mk&&x.data<=fim;}
  var cs=docs.filter(function(x){return x.tipo==="c"&&dentro(x);}),as=docs.filter(function(x){return x.tipo==="a"&&dentro(x);});
  var pessoas=S.isLider?C.equipe:C.equipe.filter(function(e){return e.adv&&e.adv===S.advNome;});
  var rows=[];
  pessoas.forEach(function(e){
    var c=cs.filter(function(x){return x.aud===e.id;}),a=as.filter(function(x){return x.aud===e.id;});
    if(e.ativo===false&&!c.length&&!a.length)return;
    rows.push(mtRow(e,c,a,R));
  });
  var sem;
  if(S.isLider){
    var tot=cs.length,colet=tot>=R.coletMeta;
    var allRows=rows.filter(function(r){return r.elegivel;}),bonus=(colet&&allRows.length)?Math.floor(R.coletBonus/allRows.length*100)/100:0;
    sem={total:tot,colet:colet,nEleg:allRows.length,bonus:bonus};
  }else{
    var g=(S.mtSem||{})[mk]||{total:cs.length,colet:false,nEleg:0,bonus:0};
    sem={total:g.total||0,colet:!!g.colet,nEleg:g.nEleg||0,bonus:g.bonus||0};
  }
  rows.forEach(function(r){
    r.bonus=(sem.colet&&r.elegivel)?sem.bonus:0;
    r.total=r.premioConv+r.bonus+(R.incluirAval?r.premioAval:0);
  });
  return {mk:mk,fim:fim,rows:rows,sem:sem,soma:rows.reduce(function(s,r){return s+r.total;},0)};
}
function mtMesSemanas(ini){
  var d=parseKey(ini),y=d.getFullYear(),m=d.getMonth(),mk=addDays(mondayKey(d),-7),out=[];
  for(var i=0;i<8;i++){var f=parseKey(addDays(mk,4));if(f.getFullYear()===y&&f.getMonth()===m)out.push(mk);mk=addDays(mk,7);}
  return out;
}
function mtPeriodo(modo){
  var ref=parseKey(S.mtRef),y=ref.getFullYear(),mo=ref.getMonth();
  if(modo==="mes"){
    var ini=y+"-"+pad(mo+1)+"-01";
    return {modo:"mes",ini:ini,label:MT_MESES[mo]+" de "+y,titulo:"Relatório mensal de metas",slug:"mes-"+y+"-"+pad(mo+1)};
  }
  var mk=mondayKey(ref);
  return {modo:"semana",ini:mk,label:"semana de "+br(mk)+" a "+br(addDays(mk,6)),titulo:"Relatório semanal de metas",slug:"semana-"+mk};
}
function mtPeriodoCalc(per){
  var mks=per.modo==="mes"?mtMesSemanas(per.ini):[per.ini],R=mtCfg().regras;
  var ws=mks.map(mtSemana),map={},order=[];
  ws.forEach(function(w){w.rows.forEach(function(r){
    var a=map[r.id];
    if(!a){a=map[r.id]={id:r.id,nome:r.nome,nc:0,na:0,semPrint:0,premioConv:0,bonus:0,premioAval:0,total:0,semanasMeta:0,convs:[],avals:[]};order.push(r.id);}
    a.nc+=r.nc;a.na+=r.na;a.semPrint+=r.semPrint;a.premioConv+=r.premioConv;a.bonus+=r.bonus;a.premioAval+=r.premioAval;a.total+=r.total;
    if(r.nc>=R.conv[0][0])a.semanasMeta++;
    a.convs=a.convs.concat(r.convs);a.avals=a.avals.concat(r.avals);
  });});
  var rows=order.map(function(id){return map[id];});
  rows.forEach(function(r){r.convs.sort(function(x,y){return x.data.localeCompare(y.data);});r.avals.sort(function(x,y){return x.data.localeCompare(y.data);});});
  return {per:per,weeks:ws,rows:rows,totalConv:ws.reduce(function(s,w){return s+w.sem.total;},0),
    totalAval:rows.reduce(function(s,r){return s+r.na;},0),totalPagar:rows.reduce(function(s,r){return s+r.total;},0),
    semanasColet:ws.filter(function(w){return w.sem.colet;}).length,nSem:ws.length,semPrint:rows.reduce(function(s,r){return s+r.semPrint;},0)};
}
function mtRegrasTexto(){
  var R=mtCfg().regras;
  return "Conversões individuais por semana: "+R.conv.map(function(t){return t[0]+" = "+mtMoney(t[1]);}).join("; ")+
    ". Meta coletiva: "+R.coletMeta+" conversões no setor rendem "+mtMoney(R.coletBonus)+", divididos igualmente entre quem fez "+R.coletMin+" ou mais, e acumulam com a meta individual. "+
    "Avaliações de 5 estrelas por semana: "+R.aval.map(function(t){return t[0]+" = "+mtMoney(t[1]);}).join("; ")+(R.incluirAval?"":" (fora do total a pagar)")+
    ". Apuração pela data de assinatura do contrato. A semana entra no mês em que cai a sexta-feira.";
}

function startMetas(tok){
  stopMetas();

  S.unsubMt=[];

/* A liderança mantém o resumo coletivo por semana, para a equipe ver a meta do setor sem ler os lançamentos dos colegas. */
function mtAutoSync(){
  if(!S.isLider||!S.mtLoaded||!S.mtLoaded.cfg||!S.mtLoaded.docs)return;
  var weeks={};(S.mtDocs||[]).forEach(function(d){if(d.data)weeks[mondayKey(parseKey(d.data))]=1;});
  Object.keys(S.mtSem||{}).forEach(function(k){weeks[k]=1;});
  S.mtPend=S.mtPend||{};
  Object.keys(weeks).forEach(function(mk){
    var w=mtSemana(mk),n={total:w.sem.total,colet:w.sem.colet,nEleg:w.sem.nEleg,bonus:w.sem.bonus},o=(S.mtSem||{})[mk];
    var sig=JSON.stringify(n);
    if(o&&o.total===n.total&&o.colet===n.colet&&o.nEleg===n.nEleg&&o.bonus===n.bonus)return;
    if(S.mtPend[mk]===sig)return;
    S.mtPend[mk]=sig;
    Store.putMetasSem(mk,Object.assign({em:Date.now()},n)).catch(function(){delete S.mtPend[mk];});
  });
}

    if(typeof XLSX==="undefined"){toast("O gerador de planilhas não carregou.");return;}
    baixar("metas-"+P.per.slug+(S.isLider?"":"-individual")+".xlsx",new Blob([mtXlsx(P)],{type:"application/octet-stream"}),"application/octet-stream");toast("Planilha gerada.");}}));
  acts.appendChild(h("button",{class:"btn ghost",type:"button",text:"Baixar em texto",onclick:function(){baixar("metas-"+P.per.slug+".txt",mtTexto(P),"text/plain;charset=utf-8");toast("Relatório baixado.");}}));
  box.appendChild(acts);
  var stats=h("div",{class:"stats"});
  function stat(l,v){return h("div",{class:"stat"},h("b",{text:v}),h("div",{class:"muted",text:l}));}
  stats.appendChild(stat(S.isLider?"Conversões do setor":"Minhas conversões",String(S.isLider?P.totalConv:P.rows.reduce(function(s,r){return s+r.nc;},0))));
  stats.appendChild(stat("Avaliações de 5 estrelas",String(P.totalAval)));
  stats.appendChild(stat(S.isLider?"Total a pagar":"Meu total",mtMoney(P.totalPagar)));
  box.appendChild(stats);
  var tb=h("table",{class:"mt-tab"},h("thead",null,h("tr",null,["Audiencista","Conversões","Avaliações","Conversões (R$)","Coletivo (R$)","Avaliações (R$)","Total (R$)"].map(function(t){return h("th",{text:t});}))));
  var body=h("tbody");
  P.rows.forEach(function(r){body.appendChild(h("tr",null,[r.nome,r.nc,r.na,mtMoney(r.premioConv),mtMoney(r.bonus),mtMoney(r.premioAval),mtMoney(r.total)].map(function(v){return h("td",{text:String(v)});})));});
  if(!P.rows.length)body.appendChild(h("tr",null,h("td",{colspan:"7",text:"Nenhum lançamento no período."})));
  tb.appendChild(body);box.appendChild(h("div",{style:"overflow-x:auto"},tb));
  box.appendChild(h("p",{class:"hint",text:mtRegrasTexto()}));
}

/* ---------- equipe e regras (liderança) ---------- */
function mtSalvaCfg(c){return Store.saveMetasCfg({equipe:c.equipe,regras:c.regras}).catch(function(e){toast(errMsg(e));});}
function mtAjustes(box){
  var C=mtCfg(),nomes=Object.keys(ADV_COR);
  box.appendChild(h("h2",{class:"card-title",style:"font-size:18px",text:"Equipe nas metas"}));
  box.appendChild(h("p",{class:"muted",text:"O nome da pauta liga cada pessoa à conta dela: é assim que cada audiencista vê só os próprios números."}));
  C.equipe.forEach(function(e){
    box.appendChild(h("div",{class:"card",style:"padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"},
      h("b",{style:"flex:1 1 160px",text:e.nome+(e.ativo===false?" (desativado)":"")}),
      h("span",{class:"muted",text:e.adv?"Pauta: "+e.adv:"Sem vínculo com a pauta"}),
      h("button",{class:"btn ghost sm",type:"button",text:"Editar",onclick:function(){mtPessoaForm(e);}}),
      h("button",{class:"btn ghost sm",type:"button",text:e.ativo===false?"Reativar":"Desativar",onclick:function(){
        var n=mtCfg();n.equipe=n.equipe.map(function(x){return x.id===e.id?Object.assign({},x,{ativo:x.ativo===false}):x;});mtSalvaCfg(n);}})));
  });
  box.appendChild(h("div",{class:"actions",style:"margin:12px 0 28px"},h("button",{class:"btn navy",type:"button",text:"Adicionar pessoa",onclick:function(){mtPessoaForm(null);}})));
  box.appendChild(h("h2",{class:"card-title",style:"font-size:18px",text:"Regras de pagamento"}));
  var R=C.regras;
  function nums(t){return t.map(function(x){return x[0]+":"+x[1];}).join(", ");}
  function parse(s){return String(s).split(",").map(function(p){var q=p.split(":");return [parseInt(q[0],10),parseFloat(String(q[1]).replace(",","."))];}).filter(function(q){return q[0]>0&&q[1]>=0;}).sort(function(a,b){return a[0]-b[0];});}
  var fc=h("input",{type:"text",id:"mt-rc",value:nums(R.conv)}),fa=h("input",{type:"text",id:"mt-ra",value:nums(R.aval)});
  var cm=h("input",{type:"text",id:"mt-cm",value:String(R.coletMeta)}),cb=h("input",{type:"text",id:"mt-cb",value:String(R.coletBonus)}),cn=h("input",{type:"text",id:"mt-cn",value:String(R.coletMin)});
  var ia=h("input",{type:"checkbox",id:"mt-ia",checked:R.incluirAval});
  box.appendChild(h("div",{class:"filters"},
    h("div",{class:"field"},h("label",{for:"mt-rc",text:"Conversões: quantidade:valor"}),fc,h("p",{class:"hint",text:"Ex.: 5:150, 7:250, 10:400"})),
    h("div",{class:"field"},h("label",{for:"mt-ra",text:"Avaliações: quantidade:valor"}),fa,h("p",{class:"hint",text:"Ex.: 6:80, 10:150"})),
    h("div",{class:"field"},h("label",{for:"mt-cm",text:"Meta coletiva (conversões)"}),cm),
    h("div",{class:"field"},h("label",{for:"mt-cb",text:"Bônus coletivo (R$)"}),cb),
    h("div",{class:"field"},h("label",{for:"mt-cn",text:"Mínimo individual para o bônus"}),cn)));
  box.appendChild(h("div",{class:"field"},h("label",null,ia," Incluir as avaliações no total a pagar")));
  box.appendChild(h("div",{class:"actions"},h("button",{class:"btn primary",type:"button",text:"Salvar regras",onclick:function(){
    var rc=parse(fc.value),ra=parse(fa.value),n=mtCfg();
    if(!rc.length||!ra.length){toast("Informe ao menos uma faixa de conversões e de avaliações, no formato 5:150.");return;}
    n.regras={conv:rc,aval:ra,coletMeta:parseInt(cm.value,10)||MT_DEF.coletMeta,coletBonus:parseFloat(String(cb.value).replace(",","."))||0,coletMin:parseInt(cn.value,10)||0,incluirAval:ia.checked};
    mtSalvaCfg(n).then(function(){toast("Regras salvas.");});}})));
  box.appendChild(h("h2",{class:"card-title",style:"font-size:18px;margin-top:32px",text:"Trazer dados do artefato Metas Semanais"}));
  box.appendChild(h("p",{class:"muted",text:"Escolha o arquivo metas-migracao.json para copiar equipe, regras, conversões e avaliações para este painel. Lançamentos com o mesmo código são sobrescritos, então pode repetir sem duplicar."}));
  var st=h("p",{class:"muted",role:"status"}),fin=h("input",{type:"file",accept:".json",class:"vh",id:"mt-mig"});
  fin.addEventListener("change",function(){
    var f=fin.files&&fin.files[0];if(!f)return;var rd=new FileReader();
    rd.onload=function(){
      var o;try{o=JSON.parse(rd.result);}catch(e){st.textContent="Arquivo inválido.";return;}
      if(!o||!o.cfg||!o.docs){st.textContent="Este arquivo não parece ser a migração das metas.";return;}
      st.textContent="Importando…";
      Store.importMetas(o).then(function(n){st.textContent=n+" lançamento(s) e a configuração foram importados.";toast("Importação concluída.");}).catch(function(e){st.textContent=errMsg(e);});};
    rd.readAsText(f);fin.value="";});
  box.appendChild(h("div",{class:"actions"},h("button",{class:"btn ghost",type:"button",text:"Escolher arquivo",onclick:function(){fin.click();}}),fin));
  box.appendChild(st);
}
function mtPessoaForm(e){
  var nome=h("input",{type:"text",id:"mp-n",maxlength:"60",value:e?e.nome:""}),adv=h("select",{id:"mp-a"},h("option",{value:"",text:"Sem vínculo com a pauta"}));
  Object.keys(ADV_COR).forEach(function(n){adv.appendChild(h("option",{value:n,text:n,selected:e&&e.adv===n}));});
  modal(h("div",{class:"modal"},h("h2",{text:e?"Editar pessoa":"Adicionar pessoa"}),
    h("div",{class:"field"},h("label",{for:"mp-n",text:"Nome nas metas"}),nome),
    h("div",{class:"field"},h("label",{for:"mp-a",text:"Nome na pauta (liga à conta dela)"}),adv),
    h("div",{class:"actions"},h("button",{class:"btn ghost",type:"button",text:"Cancelar",onclick:fechaModal}),
      h("button",{class:"btn primary",type:"button",text:"Salvar",onclick:function(){
        var nm=nome.value.trim();if(!nm){toast("Informe o nome.");return;}
        var n=mtCfg(),antigo=e?e.adv:"";
        if(e)n.equipe=n.equipe.map(function(x){return x.id===e.id?Object.assign({},x,{nome:nm,adv:adv.value}):x;});
        else n.equipe=n.equipe.concat([{id:"p"+mtNewId(),nome:nm,adv:adv.value,ativo:true}]);
        mtSalvaCfg(n).then(function(){
          if(e&&antigo!==adv.value)(S.mtDocs||[]).filter(function(d){return d.aud===e.id;}).forEach(function(d){Store.putMeta(d.id,Object.assign({},d,{adv:adv.value})).catch(function(){});});
        });
        fechaModal();}}))));
}

/* ====================== Inicialização ====================== */
function boot(){
  try{REL_CFG.logo=$(".logo img").src;}catch(e){}
  var temFb=typeof window.firebase!=="undefined"&&firebase.initializeApp&&firebase.firestore&&firebase.auth;
  if(temFb){
    try{FB.init();}catch(e){
      $("#app").hidden=false;$("#banner").appendChild(h("div",{class:"banner err",role:"alert"},h("span",{text:"Não foi possível iniciar o Firebase: "+((e&&e.message)||e)})));return;
    }
    S.mode="firebase";Store=FB;
    FB.onAuth(function(u){if(u)afterLogin(u);else{S.user=null;showLogin();}});
  }else{
    S.mode="demo";Store=Demo;S.user=PERSONAS.equipe;S.perfil={nome:PERSONAS.equipe.nome,lidos:{}};S.reads={};
    startApp();
  }
}
boot();
})();
</script>
